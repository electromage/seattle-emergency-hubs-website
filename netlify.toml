[build]
  command = "API_KEY=\"${GOOGLE_MAPS_API_KEY:-$GOOGLE_API_KEY}\"; if [ -z \"$API_KEY\" ]; then echo 'Missing GOOGLE_MAPS_API_KEY (or legacy GOOGLE_API_KEY)'; exit 1; fi; printf 'window.GOOGLE_MAPS_API_KEY = \"%s\";\\n' \"$API_KEY\" > js/runtime-config.js"
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_MAPS_API_KEY"
