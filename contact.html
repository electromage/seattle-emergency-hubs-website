<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Seattle Emergency Hubs with questions about hubs, volunteering, training, or emergency preparedness." />
  <title>Contact Us - Seattle Emergency Hubs</title>
  <script>try{var q=new URLSearchParams(location.search),t=q.get("theme"),m=q.get("mode");if(t!==null)localStorage.setItem("seh-skin",t);if(m==="dark"||m==="light")localStorage.setItem("seh-theme",m);var s=localStorage.getItem("seh-skin");if(s)document.documentElement.setAttribute("data-skin",s);if(localStorage.getItem("seh-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/themes.css" />
</head>
<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div id="site-header-placeholder"></div>

  <main id="main-content">

    <h1 class="section-title">Contact Us</h1>

    <p class="mb-3">Questions about a hub, volunteering, training, or getting your neighborhood prepared? Send us a message and a volunteer will get back to you.</p>

    <form id="contact-form" class="contact-form" novalidate>

      <div class="form-row">
        <label for="contact-name">Name</label>
        <input id="contact-name" name="name" type="text" autocomplete="name" maxlength="100" required />
      </div>

      <div class="form-row">
        <label for="contact-email">Email</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="254" required />
      </div>

      <div class="form-row">
        <label for="contact-subject">Subject</label>
        <input id="contact-subject" name="subject" type="text" maxlength="150" required />
      </div>

      <div class="form-row">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="7" maxlength="5000" required></textarea>
      </div>

      <!-- Honeypot: hidden from people, tempting to bots. -->
      <div class="form-honeypot" aria-hidden="true">
        <label for="contact-website">Website</label>
        <input id="contact-website" name="website" type="text" tabindex="-1" autocomplete="off" />
      </div>

      <div id="contact-turnstile" class="form-row"></div>

      <div id="contact-status" class="form-status" role="status" aria-live="polite" hidden></div>

      <button type="submit" class="btn btn-primary btn-lg">Send Message</button>

    </form>

  </main>

  <div id="site-footer-placeholder"></div>

  <script src="js/runtime-config.js"></script>
  <script src="js/hubs.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/contact.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=sehTurnstileReady" async defer></script>
</body>
</html>
